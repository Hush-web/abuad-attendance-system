<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sessions — ABUAD Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
<div id="offline-banner">&#9888; Offline</div><div id="toast"></div>
<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div style="width:38px;height:38px;background:#C9A84C;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#1C2D5E;font-size:1rem;flex-shrink:0">A</div><span>ABUAD<br>Attendance</span></div>
    <div class="sidebar-nav">
      <div class="nav-section">Main</div>
      <div class="nav-item" data-page="dashboard.html"><span class="icon">&#127968;</span> Dashboard</div>
      <div class="nav-item" data-page="courses.html"><span class="icon">&#128218;</span> Courses</div>
      <div class="nav-item" data-page="sessions.html" data-role="admin,lecturer"><span class="icon">&#128197;</span> Sessions</div>
      <div class="nav-section" data-role="student">My Attendance</div>
      <div class="nav-item" data-page="enrol.html" data-role="student"><span class="icon">&#128247;</span> Face Enrolment</div>
      <div class="nav-item" data-page="mark-attendance.html" data-role="student"><span class="icon">&#9989;</span> Mark Attendance</div>
      <div class="nav-section" data-role="admin,lecturer">Management</div>
      <div class="nav-item" data-page="students.html" data-role="admin,lecturer"><span class="icon">&#128101;</span> Students</div>
      <div class="nav-item" data-page="reports.html" data-role="admin,lecturer"><span class="icon">&#128202;</span> Reports</div>
    </div>
    <div class="sidebar-footer">
      <div class="user-badge" style="margin-bottom:.6rem">
        <div class="user-avatar" id="user-avatar">U</div>
        <div><div id="user-name" style="font-weight:600;font-size:.85rem;color:#fff"></div><div id="user-role" style="font-size:.75rem;color:#C9A84C"></div></div>
      </div>
      <button class="btn btn-outline btn-sm btn-full" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="logout()">Sign Out</button>
    </div>
  </nav>
  <div class="main-content">
    <div class="topbar">
      <button id="menu-toggle" style="background:none;border:none;font-size:1.4rem;cursor:pointer">&#9776;</button>
      <div class="topbar-title">Class Sessions</div>
      <div class="topbar-right"><button class="btn btn-primary btn-sm" onclick="openModal('cm')">+ New Session</button></div>
    </div>
    <div class="page-content">
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Course</th><th>Time</th><th>Location</th><th>Present</th><th>QR</th><th>Report</th></tr></thead>
        <tbody id="stbody"><tr><td colspan="7" style="text-align:center;color:#94A3B8">Loading…</td></tr></tbody>
      </table></div></div>
    </div>
  </div>
</div>
<div class="modal-overlay hidden" id="cm">
  <div class="modal-box">
    <div class="modal-header"><div class="modal-title">New Class Session</div><button class="modal-close">&#x2715;</button></div>
    <div class="form-group"><label>Course</label><select id="sc"></select></div>
    <div class="form-row">
      <div class="form-group"><label>Date</label><input type="date" id="sd"></div>
      <div class="form-group"><label>Start Time</label><input type="time" id="st"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>End Time</label><input type="time" id="et"></div>
      <div class="form-group"><label>QR Tokens</label><input type="number" id="tc" value="20" min="5" max="50"></div>
    </div>
    <div class="form-group"><label>Location</label><input type="text" id="sl2" placeholder="e.g. LT 1"></div>
    <button class="btn btn-primary btn-full" onclick="createSess()">Create Session &amp; Generate Tokens</button>
    <div id="serr" class="alert alert-danger" style="display:none;margin-top:.8rem"></div>
  </div>
</div>
<div class="modal-overlay hidden" id="qm">
  <div class="modal-box" style="text-align:center">
    <div class="modal-header"><div class="modal-title">QR Token</div><button class="modal-close">&#x2715;</button></div>
    <div class="qr-wrap"><img id="qi" src="" alt="QR"><div id="qt" style="font-size:.78rem;color:#64748B;word-break:break-all;max-width:280px"></div><div id="qe" style="font-size:.82rem;color:#92400E"></div></div>
    <p style="font-size:.84rem;color:#64748B;margin-top:.6rem">Show to students to scan for attendance</p>
    <button class="btn btn-outline btn-sm" onclick="nextTok()" style="margin-top:.5rem">Next Token &#8594;</button>
  </div>
</div>
  <script src="/js/db.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
<script>
let csid=null,tidx=0;
async function load(){
  try{
    const sess=await API.getSessions();
    document.getElementById('stbody').innerHTML=sess.map(s=>'<tr><td>'+fmt.date(s.session_date)+'</td><td><strong>'+s.course_code+'</strong><br><small>'+s.course_title+'</small></td><td>'+fmt.time(s.start_time)+' – '+fmt.time(s.end_time)+'</td><td>'+s.location+'</td><td><span class="badge badge-green">'+(s.attendance_count||0)+'</span></td><td><button class="btn btn-gold btn-sm" onclick="showQR('+s.session_id+')">&#128247; QR</button></td><td><a href="/pages/reports.html?session='+s.session_id+'" class="btn btn-outline btn-sm">&#128202;</a></td></tr>').join('')||'<tr><td colspan="7" style="text-align:center;color:#94A3B8">No sessions yet</td></tr>';
  }catch(e){}
}
async function loadCourses(){
  try{const c=await API.getCourses();document.getElementById('sc').innerHTML='<option value="">Select course…</option>'+c.map(x=>'<option value="'+x.course_id+'">'+x.course_code+' — '+x.course_title+'</option>').join('');}catch(e){}
}
async function createSess(){
  const e=document.getElementById('serr');e.style.display='none';
  try{
    const b={course_id:document.getElementById('sc').value,session_date:document.getElementById('sd').value,start_time:document.getElementById('st').value,end_time:document.getElementById('et').value,location:document.getElementById('sl2').value||'Main Campus',token_count:document.getElementById('tc').value};
    if(!b.course_id||!b.session_date||!b.start_time||!b.end_time)throw new Error('Fill all required fields');
    const r=await API.createSession(b);
    await DB.saveTokens(r.tokens.map(u=>({tokenUuid:u,sessionId:r.session_id,courseId:b.course_id,expiresAt:r.expires_at})));
    toast('Session created with '+r.tokens.length+' tokens \u2713','success');
    closeModal('cm');load();
  }catch(ex){e.textContent=ex.message;e.style.display='flex';}
}
async function showQR(id){csid=id;tidx=0;await fetchQR();openModal('qm');}
async function fetchQR(){
  try{const d=await API.getSessionQR(csid,tidx);document.getElementById('qi').src=d.qr;document.getElementById('qt').textContent=d.token_uuid;document.getElementById('qe').textContent='Expires: '+fmt.dt(d.expires_at);}catch(e){toast('QR error: '+e.message,'error');}
}
async function nextTok(){tidx++;await fetchQR();}
document.getElementById('sd').value=new Date().toISOString().split('T')[0];
document.getElementById('st').value='08:00';document.getElementById('et').value='10:00';
load();loadCourses();
</script></body></html>
